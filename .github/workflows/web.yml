name: CI

# Lint + tests + build on a direct push to develop, on every PR, and in the merge queue.
# Separate from the deploy workflow so this job never runs with the Pages/OIDC permissions.
on:
  pull_request:
  push:
    branches: [develop]
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
