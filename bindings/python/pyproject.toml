[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "voidgate"
description = "Blocks prompt injection and masks personal data before it reaches an AI model. Runs in-process, no server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["llm", "ai", "agents", "prompt-injection", "guardrails", "pii", "gdpr", "lgpd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/VoidGates/VoidGate"
Issues = "https://github.com/VoidGates/VoidGate/issues"
Changelog = "https://github.com/VoidGates/VoidGate/blob/main/CHANGELOG.md"
Security = "https://github.com/VoidGates/VoidGate/blob/main/SECURITY.md"

[tool.maturin]
python-source = "python"
module-name = "voidgate._voidgate"
features = ["extension-module"]
