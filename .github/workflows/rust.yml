name: Rust

on:
  pull_request:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # bindings/python (PyO3) links libpython in `cargo test`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: node --test .github/scripts/pr-guard.test.mjs .github/scripts/release.test.mjs

  # Separate job (not a matrix) so the name of the required `verify` check does not change.
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --locked --workspace --all-targets

  # Builds the wheel and tests it the way a user installs it. 3.9 is the oldest
  # supported (abi3-py39); the same wheel must also load on a recent Python.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maturin==1.16.0 pytest==9.2.0
      - run: maturin build --release --locked -m bindings/python/Cargo.toml -o dist
      - run: python -m pip install --no-index --find-links dist voidgate
      - run: python -m pytest bindings/python/tests
      - run: python bindings/python/examples/agente_simples.py
        env:
          PYTHONIOENCODING: utf-8

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
