name: Rust

on:
  pull_request:
  push:
    # a fila ja roda por merge_group; evita rodar 2x nas branches temporarias
    branches-ignore:
      - "gh-readonly-queue/**"
  merge_group:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: node --test .github/scripts/pr-guard.test.mjs
